# Pulse sources. Validate with:  cargo run -p ingestor -- check
# Every enabled RSS feed below passed `ingestor check` when it was added.

[defaults]
poll_interval = "3m"
max_age = "72h"
timeout = "20s"
max_concurrent = 16
max_concurrent_per_host = 2
max_summary_chars = 600
user_agent = "PulseNewsBot/0.1 (news aggregation research project)"


