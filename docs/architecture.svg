<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Pulse architecture</title>
<desc id="d">RSS feeds flow through the ingestor, embedder and story processor via Kafka topics into a Postgres read model, served by the Query API to the web app.</desc>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#77746c"/></marker>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.card{fill:#fbfaf7;stroke:#e4e2db}
.svc{fill:#ffffff;stroke:#d6d3cb}
.store{fill:#f2f1ec;stroke:#d6d3cb}
.ext{fill:#ffffff;stroke:#d6d3cb;stroke-dasharray:4 3}
.topic{fill:#fdeee5;stroke:#eb6834;stroke-width:1.3}
.topic.late{fill:#fbf6f2;stroke-dasharray:4 3}
.title{font-size:15px;font-weight:650;fill:#1d1c1a}
.sub{font-size:11.8px;fill:#5f5c55}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600;fill:#8f3410}
.note{font-size:11px;fill:#6f6c64}
.badge{font-size:10.5px;font-weight:650}
.edge{font-size:11px;fill:#6f6c64;font-style:italic}
.lane{font-size:11px;font-weight:700;letter-spacing:.08em;fill:#9a978f}
.flow{fill:none;stroke:#77746c;stroke-width:1.6}
.aux{fill:none;stroke:#9a978f;stroke-width:1.3;stroke-dasharray:5 4}
.h1{font-size:20px;font-weight:700;fill:#1d1c1a}
.lede{font-size:12.5px;fill:#5f5c55}
</style></defs>
<rect x="1" y="1" width="1198" height="638" rx="18" class="card"/>
<text x="30" y="40" class="h1" text-anchor="start">Pulse</text>
<text x="92" y="40" class="lede" text-anchor="start">news in, evolving stories out: exactly once, replayable</text>
<text x="30" y="78" class="lane" text-anchor="start">INGEST + EMBED</text>
<text x="30" y="248" class="lane" text-anchor="start">CLUSTER</text>
<text x="30" y="418" class="lane" text-anchor="start">SERVE</text>
<rect x="30" y="88" width="200" height="84" rx="10" class="ext"/>
<text x="44" y="114" class="title" text-anchor="start">Sources</text>
<text x="44" y="135" class="sub" text-anchor="start">134 RSS feeds, 26 languages</text>
<text x="44" y="152" class="sub" text-anchor="start">GDELT (fixtures, load tests)</text>
<rect x="275" y="88" width="185" height="84" rx="10" class="svc"/>
<text x="289" y="114" class="title" text-anchor="start">Ingestor</text>
<rect x="415.4" y="100" width="35" height="19" rx="9.5" fill="#fbe5d9"/>
<text x="432.7" y="113.5" class="badge" fill="#9a3a12" text-anchor="middle">Rust</text>
<text x="289" y="135" class="sub" text-anchor="start">canonical URL → article id</text>
<text x="289" y="152" class="sub" text-anchor="start">polite polling, no repeats</text>
<rect x="505" y="112" width="175" height="36" rx="18" class="topic"/>
<text x="592.5" y="135" class="mono" text-anchor="middle">articles.raw</text>
<text x="592.5" y="164" class="note" text-anchor="middle">3 partitions</text>
<rect x="725" y="88" width="190" height="84" rx="10" class="svc"/>
<text x="739" y="114" class="title" text-anchor="start">Embed relay</text>
<rect x="870.4" y="100" width="35" height="19" rx="9.5" fill="#fbe5d9"/>
<text x="887.7" y="113.5" class="badge" fill="#9a3a12" text-anchor="middle">Rust</text>
<text x="739" y="135" class="sub" text-anchor="start">embed batch + offsets</text>
<text x="739" y="152" class="sub" text-anchor="start">in one Kafka transaction</text>
<rect x="960" y="88" width="210" height="84" rx="10" class="svc"/>
<text x="974" y="114" class="title" text-anchor="start">Embedder</text>
<rect x="1112.6" y="100" width="47" height="19" rx="9.5" fill="#e0ebf7"/>
<text x="1136.3" y="113.5" class="badge" fill="#235d96" text-anchor="middle">Python</text>
<text x="974" y="135" class="sub" text-anchor="start">multilingual-e5-small</text>
<text x="974" y="152" class="sub" text-anchor="start">ONNX int8 · dynamic batching</text>
<path d="M230 130 H271" class="flow" marker-end="url(#head)"/>
<path d="M460 130 H501" class="flow" marker-end="url(#head)"/>
<path d="M680 130 H721" class="flow" marker-end="url(#head)"/>
<path d="M915 124 H956" class="flow" marker-end="url(#head)"/>
<path d="M960 138 H919" class="flow" marker-end="url(#head)"/>
<text x="937" y="118" class="edge" text-anchor="middle">gRPC</text>
<rect x="725" y="282" width="190" height="36" rx="18" class="topic"/>
<text x="820.0" y="305" class="mono" text-anchor="middle">articles.embedded</text>
<text x="820.0" y="334" class="note" text-anchor="middle">1 partition · kept forever</text>
<path d="M820 172 V278" class="flow" marker-end="url(#head)"/>
<rect x="330" y="258" width="300" height="84" rx="10" class="svc"/>
<text x="344" y="284" class="title" text-anchor="start">Story Processor</text>
<rect x="585.4" y="270" width="35" height="19" rx="9.5" fill="#fbe5d9"/>
<text x="602.7" y="283.5" class="badge" fill="#9a3a12" text-anchor="middle">Rust</text>
<text x="344" y="305" class="sub" text-anchor="start">MinHash dedup · own deterministic HNSW</text>
<text x="344" y="322" class="sub" text-anchor="start">watermarks · splits + merges · snapshots</text>
<path d="M725 300 H634" class="flow" marker-end="url(#head)"/>
<rect x="30" y="258" width="200" height="84" rx="10" class="store"/>
<text x="44" y="284" class="title" text-anchor="start">Snapshots</text>
<text x="44" y="305" class="sub" text-anchor="start">local disk · zstd + bincode</text>
<text x="44" y="322" class="sub" text-anchor="start">every 5,000 inputs or 5 min</text>
<path d="M330 300 H234" class="flow" marker-end="url(#head)"/>
<text x="282" y="292" class="edge" text-anchor="middle">snapshots</text>
<rect x="960" y="258" width="210" height="84" rx="10" class="svc"/>
<text x="974" y="284" class="title" text-anchor="start">Replay</text>
<rect x="1125.4" y="270" width="35" height="19" rx="9.5" fill="#fbe5d9"/>
<text x="1142.7" y="283.5" class="badge" fill="#9a3a12" text-anchor="middle">Rust</text>
<text x="974" y="305" class="sub" text-anchor="start">re-drive any input window</text>
<text x="974" y="322" class="sub" text-anchor="start">byte-for-byte diff vs live</text>
<path d="M915 300 H956" class="aux" marker-end="url(#head)"/>
<rect x="330" y="370" width="170" height="36" rx="18" class="topic"/>
<text x="415.0" y="393" class="mono" text-anchor="middle">stories.events</text>
<rect x="520" y="370" width="140" height="36" rx="18" class="topic late"/>
<text x="590.0" y="393" class="mono" text-anchor="middle">articles.late</text>
<path d="M415 342 V366" class="flow" marker-end="url(#head)"/>
<path d="M590 342 V366" class="aux" marker-end="url(#head)"/>
<rect x="30" y="450" width="200" height="84" rx="10" class="store"/>
<text x="44" y="476" class="title" text-anchor="start">SeaweedFS (S3)</text>
<text x="44" y="497" class="sub" text-anchor="start">briefing audio, written</text>
<text x="44" y="514" class="sub" text-anchor="start">by the Query API</text>
<rect x="275" y="450" width="185" height="84" rx="10" class="svc"/>
<text x="289" y="476" class="title" text-anchor="start">Story Sink</text>
<rect x="415.4" y="462" width="35" height="19" rx="9.5" fill="#fbe5d9"/>
<text x="432.7" y="475.5" class="badge" fill="#9a3a12" text-anchor="middle">Rust</text>
<text x="289" y="497" class="sub" text-anchor="start">rows + consumed offsets</text>
<text x="289" y="514" class="sub" text-anchor="start">in one Postgres txn</text>
<rect x="505" y="450" width="190" height="84" rx="10" class="store"/>
<text x="519" y="476" class="title" text-anchor="start">Postgres + pgvector</text>
<text x="519" y="497" class="sub" text-anchor="start">read model versioned by</text>
<text x="519" y="514" class="sub" text-anchor="start">log offset: time travel</text>
<rect x="740" y="450" width="180" height="84" rx="10" class="svc"/>
<text x="754" y="476" class="title" text-anchor="start">Query API</text>
<rect x="875.4" y="462" width="35" height="19" rx="9.5" fill="#fbe5d9"/>
<text x="892.7" y="475.5" class="badge" fill="#9a3a12" text-anchor="middle">Rust</text>
<text x="754" y="497" class="sub" text-anchor="start">REST + resumable SSE</text>
<text x="754" y="514" class="sub" text-anchor="start">search · replays · listen</text>
<rect x="965" y="450" width="205" height="84" rx="10" class="svc"/>
<text x="979" y="476" class="title" text-anchor="start">Web</text>
<rect x="1087.0" y="462" width="73" height="19" rx="9.5" fill="#e2edfa"/>
<text x="1123.5" y="475.5" class="badge" fill="#1f5fa8" text-anchor="middle">TypeScript</text>
<text x="979" y="497" class="sub" text-anchor="start">story graph · timeline</text>
<text x="979" y="514" class="sub" text-anchor="start">search · listen · metrics</text>
<path d="M415 406 V446" class="flow" marker-end="url(#head)"/>
<path d="M790 318 V424 H445 V446" class="flow" marker-end="url(#head)"/>
<text x="800" y="418" class="edge" text-anchor="start">articles</text>
<path d="M460 492 H501" class="flow" marker-end="url(#head)"/>
<path d="M695 492 H736" class="flow" marker-end="url(#head)"/>
<text x="716" y="484" class="edge" text-anchor="middle">NOTIFY</text>
<path d="M920 492 H961" class="flow" marker-end="url(#head)"/>
<text x="941" y="484" class="edge" text-anchor="middle">REST · SSE</text>
<path d="M890 450 V364 H1065 V346" class="aux" marker-end="url(#head)"/>
<text x="1072" y="362" class="edge" text-anchor="start">POST /api/replays</text>
<rect x="275" y="572" width="420" height="44" rx="10" class="store"/>
<text x="289" y="599" class="title" text-anchor="start">Prometheus · Grafana</text>
<text x="452" y="599" class="sub" text-anchor="start">metrics from every service</text>
<rect x="740" y="572" width="180" height="44" rx="10" class="ext"/>
<text x="754" y="599" class="title" text-anchor="start">DeepL · ElevenLabs</text>
<path d="M830 534 V568" class="aux" marker-end="url(#head)"/>
<text x="838" y="554" class="edge" text-anchor="start">on demand, cached</text>
<rect x="965" y="578" width="56" height="20" rx="10" class="topic"/>
<text x="1029" y="592" class="note" text-anchor="start">Kafka topic</text>
<path d="M1105 588 H1135" class="aux"/>
<text x="1141" y="592" class="note" text-anchor="start">secondary</text>
<text x="965" y="614" class="note" text-anchor="start">Solid arrows: the exactly-once path</text>
</svg>
