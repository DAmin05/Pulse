[package]
name = "query-api"
description = "REST + SSE API serving stories, the story graph and replays."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-stream = "0.3.6"
axum = "0.8"
base64 = "0.22"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
futures = "0.3.34"
hex.workspace = true
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
object_store = { version = "0.14.2", features = ["aws"] }
pulse-core.workspace = true
pulse-store = { version = "0.1.0", path = "../pulse-store" }
rdkafka.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.151"
sha2.workspace = true
story-processor = { version = "0.1.0", path = "../story-processor" }
tokio.workspace = true
tokio-stream = "0.1.19"
toml = "1.1.6"
tonic = { version = "0.13", default-features = false, features = ["transport"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }
tracing.workspace = true

[lints]
workspace = true
