syntax = "proto3";

package pulse.v1;

// A single change to the story graph, emitted by the Story Processor to
// `stories.events` inside a Kafka transaction. Kafka key = the primary story id.
//
// Every field is a pure function of the input log and the starting checkpoint,
// so replaying the same range must produce byte-identical events.
message StoryEvent {
  // Deterministic: derived from (input_offset, seq).
  string event_id = 1;
  // Event time of the input that caused this event, unix epoch milliseconds.
  int64 event_time_ms = 2;
  // Processor watermark when this event was emitted, unix epoch milliseconds.
  int64 watermark_ms = 3;
  // Offset in `articles.embedded` of the input that caused this event.
  int64 input_offset = 4;
  // Position of this event among those caused by the same input.
  uint32 seq = 5;

  oneof kind {
    StoryCreated created = 10;
    ArticleAdded article_added = 11;
    StoryUpdated updated = 12;
    StorySplit split = 13;
    StoryMerged merged = 14;
    StoryClosed closed = 15;
  }
}

message StoryCreated {
  string story_id = 1;
  string seed_article_id = 2;
  string headline = 3;
  string lang = 4;
  // Set when the story came out of a split: its lineage.
  repeated string parent_story_ids = 5;
}

message ArticleAdded {
  string story_id = 1;
  string article_id = 2;
  // Similarity-weighted vote score that assigned the article to this story.
  float score = 3;
  // True when MinHash LSH matched a near-duplicate already in the story.
  bool is_duplicate = 4;
  // Set when is_duplicate is true.
  string duplicate_of = 5;
  // The article's event time was behind the watermark: it arrived after the
  // allowed lateness. Late articles may join open stories but never create one.
  bool late = 6;
}

message StoryUpdated {
  string story_id = 1;
  string headline = 2;
  string headline_article_id = 3;
  uint32 article_count = 4;
  uint32 source_count = 5;
  repeated string langs = 6;
  repeated float centroid = 7;
}

// One story became several narratives. Followed by StoryCreated + StoryUpdated
// for each child and StoryClosed (SPLIT) for the parent.
message StorySplit {
  reserved 2;
  reserved "child_story_ids";
  string parent_story_id = 1;
  repeated SplitChild children = 3;
}

message SplitChild {
  string story_id = 1;
  // Every article of the parent lands in exactly one child.
  repeated string article_ids = 2;
}

// Stories turned out to be one. Sources' articles move to the target.
// Followed by StoryClosed (MERGED) for each source and StoryUpdated for the target.
message StoryMerged {
  repeated string source_story_ids = 1;
  string target_story_id = 2;
}

enum CloseReason {
  CLOSE_REASON_UNSPECIFIED = 0;
  // No new articles for the idle timeout, measured in event time.
  CLOSE_REASON_IDLE = 1;
  // Absorbed into another story by a merge.
  CLOSE_REASON_MERGED = 2;
  // Replaced by children after a split.
  CLOSE_REASON_SPLIT = 3;
}

message StoryClosed {
  string story_id = 1;
  CloseReason reason = 2;
}
